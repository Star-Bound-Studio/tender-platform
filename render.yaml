databases:
  - name: tender-db
    plan: free
    databaseName: tender_platform
    user: tp_user

services:
  - type: web
    name: tender-api
    runtime: python
    plan: free
    pythonVersion: "3.12.0"
    buildCommand: cd backend && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tender-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        value: ""
      - key: MEILI_URL
        value: ""
      - key: MEILI_KEY
        value: ""
      - key: PYTHON_VERSION
        value: "3.12.0"
